<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Máscaras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Teste de Máscaras - CreateCustomerDialog</h1>
    
    <div class="input-group">
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" placeholder="(00) 00000-0000" oninput="formatPhone(this)">
        <div class="result" id="telefone-result">Valor limpo: </div>
    </div>
    
    <div class="input-group">
        <label for="document">Documento (CPF/CNPJ):</label>
        <input type="text" id="document" placeholder="CPF ou CNPJ" oninput="formatDocument(this)">
        <div class="result" id="document-result">Valor limpo: </div>
    </div>
    
    <div class="input-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Nome completo" maxlength="100" oninput="formatName(this)">
        <div class="result" id="nome-result">Valor: </div>
    </div>

    <script>
        function formatPhone(input) {
            let value = input.value.replace(/\D/g, '');
            let formatted = '';
            
            if (value.length <= 2) {
                formatted = value;
            } else if (value.length <= 7) {
                formatted = `(${value.slice(0, 2)}) ${value.slice(2)}`;
            } else if (value.length <= 11) {
                formatted = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
            } else {
                formatted = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7, 11)}`;
            }
            
            input.value = formatted;
            document.getElementById('telefone-result').textContent = `Valor limpo: ${value}`;
        }
        
        function formatDocument(input) {
            let value = input.value.replace(/\D/g, '');
            let formatted = '';
            
            if (value.length <= 11) {
                // CPF
                if (value.length <= 3) {
                    formatted = value;
                } else if (value.length <= 6) {
                    formatted = `${value.slice(0, 3)}.${value.slice(3)}`;
                } else if (value.length <= 9) {
                    formatted = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6)}`;
                } else {
                    formatted = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6, 9)}-${value.slice(9, 11)}`;
                }
            } else {
                // CNPJ
                if (value.length <= 2) {
                    formatted = value;
                } else if (value.length <= 5) {
                    formatted = `${value.slice(0, 2)}.${value.slice(2)}`;
                } else if (value.length <= 8) {
                    formatted = `${value.slice(0, 2)}.${value.slice(2, 5)}.${value.slice(5)}`;
                } else if (value.length <= 12) {
                    formatted = `${value.slice(0, 2)}.${value.slice(2, 5)}.${value.slice(5, 8)}/${value.slice(8)}`;
                } else {
                    formatted = `${value.slice(0, 2)}.${value.slice(2, 5)}.${value.slice(5, 8)}/${value.slice(8, 12)}-${value.slice(12, 14)}`;
                }
            }
            
            input.value = formatted;
            document.getElementById('document-result').textContent = `Valor limpo: ${value}`;
        }
        
        function formatName(input) {
            let value = input.value.replace(/[^a-zA-ZÀ-ÿ\s\-']/g, '');
            input.value = value;
            document.getElementById('nome-result').textContent = `Valor: ${value}`;
        }
    </script>
</body>
</html>
